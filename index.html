<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northside HVAC &amp; Plumbing (demo)</title>
<meta name="description" content="A voice demo: an AI receptionist for a made-up plumbing company. Not live yet.">
<style>
  :root { --bg: #0C1A2B; --text: #E6EDF3; --muted: #8FA6C2; --amber: #FFC24B; --lime: #B6FF3B; color-scheme: dark }
  * { box-sizing: border-box }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: var(--text); padding: 40px 20px;
         background: var(--bg) linear-gradient(rgba(127,166,214,.07) 1px, transparent 1px) 0 0 / 32px 32px;
         font: 17px/1.6 "Segoe UI", Roboto, Helvetica, Arial, sans-serif }
  main { max-width: 600px }
  .badge { display: inline-block; font: 700 11px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--bg); background: var(--amber); padding: 4px 8px }
  h1 { font-size: clamp(28px, 6vw, 44px); line-height: 1.08; letter-spacing: -.03em; margin: 22px 0 0 }
  p { color: #C0CEDD; margin: 16px 0 0 }
  .by { margin-top: 28px; font: 13px ui-monospace, Menlo, Consolas, monospace; color: var(--muted) }
  .by a { color: var(--text); text-decoration-color: var(--lime); text-underline-offset: 3px }
</style>
</head>
<body>
<main>
  <span class="badge">Demo · coming soon</span>
  <h1>Northside HVAC &amp; Plumbing (demo)</h1>
  <p>An AI receptionist for a made-up plumbing company, which you'll be able to call or talk to in your browser. It isn't live yet.</p>
  <p class="by">Built by Nauman · <a href="https://naumanbuilds.com">naumanbuilds.com</a></p>
</main>
</body>
</html>
